# coldstart configuration. Copy to coldstart.toml (next to where you run the
# tool) or point $COLDSTART_CONFIG / --config at it. Every value below is the
# default; delete what you do not change. Unknown keys are errors.
#
# Environment overrides: COLDSTART_HOST (or SWITCH_IP), COLDSTART_BOTBASE_PORT,
# COLDSTART_RIG_PORT, COLDSTART_FTP_PORT, COLDSTART_TWILI_PORT.

[console]
host = "192.168.128.150"
ftp_port = 5000            # sys-ftpd; also proves "the console answers"
twili_port = 15152         # twili's TCP bridge, if it runs; also proves "the console answers"
probe_timeout_s = 2.0
icmp = false               # also try `ping -c1` (a sleeping Switch may still answer it)

[botbase]
port = 6000
timeout_s = 5.0
shot_timeout_s = 15.0      # pixelPeek is ~0.5 MB of hex
click_hold_ms = 0          # >0: configure buttonClickSleepTime (sys-botbase default 50 ms)

[screenshot]
source = "album"           # "album": CAPTURE + fetch from /Nintendo/Album over FTP; "pixelpeek"
capture_wait_s = 2.5       # after CAPTURE, before looking for the new album file
capture_timeout_s = 8.0    # no new file by then: capture refused (screen = unknown)
album_root = "/Nintendo/Album"
delete_after = true        # delete the captured image from the card after download
ftp_timeout_s = 10.0

[rig]
port = 5600
ping_timeout_s = 1.0

[twili]
enabled = false            # optional; without it deaf apps are closed via HOME, X, A
twib = "twib"
twibd = "twibd"
socket = ""                # empty: run our own twibd; else the socket of a running twibd
hbl_title_id = "01007ef00011e000"
timeout_s = 15.0
terminate_wait_s = 5.0     # how long the process may stay in `ps` after terminate

[launch]
tile = 0                   # 0 = leftmost = most recently played application
dleft_presses = 12
settle_home_s = 2.5        # after HOME (the menu animates)
settle_dpad_s = 0.4
settle_a_s = 3.0           # after A on a tile / on the profile picker
settle_dialog_s = 2.0      # after A on an error dialog
settle_close_s = 4.0       # after A on the "Close software" prompt
max_normalize_steps = 5    # screenshots/presses spent getting to HOME
wait_rig_s = 120.0
rig_poll_s = 2.0

[classify]
refs_dir = "refs"
grid = [16, 9]             # columns, rows of mean colours
crop = [0.0, 0.12, 1.0, 1.0]   # x0, y0, x1, y1 fractions; default drops the clock bar
threshold = 40.0           # nearest reference farther than this -> unknown

[supervise]
poll_s = 5.0
silent_s = 60.0
heartbeat_s = 600.0
attempts = 3
backoff_s = [60.0, 120.0]  # waits between attempts; the last value repeats
human_poll_s = 30.0
human_rearm_s = 1800.0     # after "failed N times", try again after this long (0 = never)

[notify]
webhook = ""               # POST JSON here on "needs a human"
timeout_s = 5.0

[paths]
runs_dir = "runs"
